name: Monitor de acciones

on:
  schedule:
    - cron: "0 * * * *"      # cada hora (UTC)
  workflow_dispatch:          # permite ejecutarlo a mano desde GitHub

permissions:
  contents: write             # para poder guardar acciones/state.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install tradingview-ta requests pyyaml

      - name: Ejecutar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_acciones.py

      - name: Guardar el estado actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acciones/state.json
          git diff --staged --quiet || git commit -m "chore: actualiza estado de señales técnicas"
          git push
